name: Changelog append

# On every push to main, walk the commits in the push range and append bullets
# under the "## Unreleased" heading in CHANGELOG.md. Then commit the updated
# file back to main.
#
# Spirit-port of WKVRCProxy/.github/workflows/changelog-append.yml. Differences:
#   - Single CHANGELOG.md (no wiki/Changelog.md mirror; this repo has no wiki).
#   - Inline python3 bucketing instead of porting the 472-LOC pwsh helper
#     (Update-Changelog.ps1) which has WKVRCProxy-specific assumptions
#     (build-stamp regex from a prepare-commit-msg hook this repo doesn't have).
#   - No trigger of wiki-sync (no wiki to sync).
#
# A push made by GITHUB_TOKEN does NOT trigger workflow runs, so the appender's
# own commit-and-push won't recurse.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'

permissions:
  contents: write

concurrency:
  # Serialise: two concurrent appenders racing to push could lose entries.
  group: changelog-append
  cancel-in-progress: false

jobs:
  append:
    if: ${{ github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip changelog]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute push range
        id: range
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          after='${{ github.event.after }}'
          if [[ "$before" =~ ^0+$ ]]; then
            range="HEAD~1..HEAD"
          elif git merge-base --is-ancestor "$before" "$after" 2>/dev/null; then
            range="$before..$after"
          else
            range="HEAD~1..HEAD"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Computed range: $range"

      - name: Append commits to CHANGELOG.md
        id: append
        shell: bash
        env:
          PUSH_RANGE: ${{ steps.range.outputs.range }}
        run: |
          set -euo pipefail
          python3 .github/scripts/update_changelog.py --range "$PUSH_RANGE"
          if git diff --quiet CHANGELOG.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff --stat CHANGELOG.md
          fi

      - name: Commit and push
        if: steps.append.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md
          git commit -m "docs(changelog): auto-append entries from ${GITHUB_SHA::7} [skip changelog]

          Generated by .github/workflows/changelog-append.yml."
          git push origin "HEAD:${GITHUB_REF_NAME}"
