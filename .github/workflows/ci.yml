name: CI

# Mirrors WKVRCProxy/.github/workflows/ci.yml in shape (paths-ignore for doc-only
# changes, concurrency cancel-in-progress, single test job). The job itself runs
# Python plugin discovery instead of dotnet build + test because this repo
# ships a Python package, not a Windows exe.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint + tests
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force

      - name: Lint and test
        shell: pwsh
        run: ./scripts/lint.ps1

  plugin-discovery:
    name: yt-dlp plugin discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test release notes
        run: python .github/scripts/test_generate_release_notes.py

      - name: Install yt-dlp (nightly) + this plugin
        run: |
          python -m pip install --upgrade pip
          # Match the production install: nightly yt-dlp via --pre, then the
          # plugin in editable mode so any local change in the PR is exercised.
          python -m pip install --pre "yt-dlp[default]"
          python -m pip install -e .

      - name: Smoke -- plugin discovery + placeholder extract
        run: |
          # `-v --simulate` against the placeholder URL verifies BOTH the
          # plugin namespace is discovered (verbose output prints
          # "Extractor Plugins: WhyKnotPluginPlaceholderIE") AND the
          # extractor's _real_extract returns the expected info_dict.
          # `--list-extractors` does NOT include external plugin extractors
          # in some yt-dlp versions, so we don't rely on it.
          # The placeholder is offline-safe (static info_dict), so this
          # works in CI without network egress to the test host.
          yt-dlp --version
          yt-dlp -v --simulate --skip-download --print "%(id)s|%(title)s" \
            "https://plugin-test.whyknot.dev/test/ci-sample" 2>&1 | tee /tmp/out
          grep -qE 'Extractor Plugins:.*WhyKnotPluginPlaceholderIE' /tmp/out
          grep -q '^ci-sample|WhyKnot Plugin Loaded$' /tmp/out
