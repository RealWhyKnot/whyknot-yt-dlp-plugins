name: CI

# Mirrors WKVRCProxy/.github/workflows/ci.yml in shape (paths-ignore for doc-only
# changes, concurrency cancel-in-progress, single test job). The job itself runs
# Python plugin discovery instead of dotnet build + test because this repo
# ships a Python package, not a Windows exe.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '!CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin-discovery:
    name: yt-dlp plugin discovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install yt-dlp (nightly) + this plugin
        run: |
          python -m pip install --upgrade pip
          # Match the production install: nightly yt-dlp via --pre, then the
          # plugin in editable mode so any local change in the PR is exercised.
          python -m pip install --pre "yt-dlp[default]"
          python -m pip install -e .

      - name: Confirm plugin namespace is loaded
        run: |
          # yt-dlp -v emits a "Loaded N plugins" line on startup when the
          # yt_dlp_plugins.extractor namespace is populated. We don't grep
          # for an exact count -- we just want to see plugin output and
          # the placeholder IE shows in `-v --list-extractors`.
          yt-dlp --version
          yt-dlp -v --list-extractors 2>&1 | grep -iE 'whyknot|Extractor Plugins'

      - name: Smoke -- placeholder extract simulation
        run: |
          # The placeholder _real_extract returns a static info_dict and never
          # touches the network, so this assertion runs offline-safe in CI.
          yt-dlp --simulate --skip-download --print "%(id)s|%(title)s" \
            "https://plugin-test.whyknot.dev/test/ci-sample" | tee /tmp/out
          grep -q "^ci-sample|WhyKnot Plugin Loaded$" /tmp/out
