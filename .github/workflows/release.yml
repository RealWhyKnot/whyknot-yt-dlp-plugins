name: Release

# Triggered by pushing a tag like v2026.5.6.0 (CalVer; .N = daily build counter
# starting at 0). build.ps1 validates the shape and fails fast on a malformed
# tag. The tag (minus the leading "v") drives the Python package version --
# pyproject.toml's `version = "..."` is rewritten in-place by build.ps1 so the
# sdist + wheel filenames match the tag.
#
# Spirit-port of WKVRCProxy/.github/workflows/release.yml. Differences:
#   - Python sdist + wheel artifacts (uv build) instead of dotnet single-file exe.
#   - No promotion-PR dance: no branch protection that blocks bot pushes to main
#     yet on this repo, but the changelog promotion still goes through the
#     verified-bot-commits createCommitOnBranch path so it lands signed.
#   - generate_release_notes.py composes the body from per-template sections,
#     auto-changelog slice, and a wheel+sdist integrity table; release body is
#     never hand-written.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Share a concurrency group with changelog-append so the appender can't run
# during a release publish and add entries to main's Unreleased that the
# release itself doesn't contain.
concurrency:
  group: changelog-append
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect beta tag
        id: beta
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          if [[ "$tag" == *-beta* ]]; then
            echo "is_beta=true"  >> "$GITHUB_OUTPUT"
            echo "release_flags=--prerelease --latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
            echo "release_flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Set up PowerShell (for build.ps1)
        # Ubuntu runners ship pwsh by default but be explicit so a future
        # runner-image change does not break the release silently.
        run: pwsh --version

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build

      - name: Promote Unreleased -> tagged section
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 .github/scripts/promote_changelog.py --tag "$TAG_NAME"
          # Stash the promoted file so we can re-apply it on main after the
          # release. Doing it now (before build.ps1 mutates pyproject.toml)
          # means the bytes pushed back to main are exactly what shipped.
          mkdir -p .changelog-stash
          cp CHANGELOG.md .changelog-stash/CHANGELOG.md

      - name: Build distribution
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Strip the leading "v" so the version baked into the package matches
          # the tag. build.ps1 validates the YYYY.M.D.N shape and rewrites
          # pyproject.toml in-place with the resolved version.
          $version = $env:TAG_NAME -replace '^v', ''
          ./build.ps1 -Version $version
          # Stash the bumped pyproject.toml so the post-publish step can
          # commit the version bump back to main. Without this, the tarball
          # at https://github.com/.../archive/refs/heads/main.tar.gz keeps
          # the prior pyproject version, and downstream `pip install -U
          # "whyknot-yt-dlp-plugins @ <tarball>"` skips the upgrade because
          # the resolver sees no version change.
          New-Item -ItemType Directory -Force .pyproject-stash | Out-Null
          Copy-Item pyproject.toml .pyproject-stash/pyproject.toml -Force

      - name: Locate artifacts
        id: art
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/*.whl | head -1)
          sdist=$(ls dist/*.tar.gz | head -1)
          if [[ -z "$wheel" || -z "$sdist" ]]; then
            echo "Build did not produce both a wheel and an sdist." >&2
            exit 1
          fi
          wheel_sha=$(sha256sum "$wheel" | awk '{print $1}')
          sdist_sha=$(sha256sum "$sdist" | awk '{print $1}')
          wheel_size=$(stat -c %s "$wheel")
          sdist_size=$(stat -c %s "$sdist")
          {
            echo "wheel=$wheel"
            echo "sdist=$sdist"
            echo "wheel_sha=$wheel_sha"
            echo "sdist_sha=$sdist_sha"
            echo "wheel_size=$wheel_size"
            echo "sdist_size=$sdist_size"
          } >> "$GITHUB_OUTPUT"
          echo "Wheel: $wheel ($wheel_size bytes, sha256 $wheel_sha)"
          echo "Sdist: $sdist ($sdist_size bytes, sha256 $sdist_sha)"

      - name: Generate release body
        id: body
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # gh release list is used by the prev-tag resolver's subject-match
          # fallback. Without it the resolver silently falls through to the
          # root walk, which produces a giant slice on rebased histories.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file="$RUNNER_TEMP/release-body.md"
          # Compose the full release body: title + auto-changelog slice +
          # File integrity (wheel + sdist) + four templated evergreen sections
          # (More / Install / Local development / What you need to do) +
          # optional .github/release-extras/<tag>.md. See the script for
          # filtering rules, token substitution, and scrub gates.
          python3 .github/scripts/generate_release_notes.py \
            --wheel      "${{ steps.art.outputs.wheel }}" \
            --wheel-sha  "${{ steps.art.outputs.wheel_sha }}" \
            --wheel-size "${{ steps.art.outputs.wheel_size }}" \
            --sdist      "${{ steps.art.outputs.sdist }}" \
            --sdist-sha  "${{ steps.art.outputs.sdist_sha }}" \
            --sdist-size "${{ steps.art.outputs.sdist_size }}" \
            > "$body_file"
          if [[ ! -s "$body_file" ]]; then
            echo "::error::generate_release_notes.py produced an empty body. Inspect the workflow log."
            exit 1
          fi
          echo "body_file=$body_file" >> "$GITHUB_OUTPUT"
          echo "Composed body: $(wc -c < "$body_file") chars"

      - name: Create GitHub release
        id: publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          WHEEL: ${{ steps.art.outputs.wheel }}
          SDIST: ${{ steps.art.outputs.sdist }}
        run: |
          set -euo pipefail
          gh release create "$TAG_NAME" "$WHEEL" "$SDIST" \
            --title "$TAG_NAME" \
            --notes-file "${{ steps.body.outputs.body_file }}" \
            ${{ steps.beta.outputs.release_flags }}

      - name: Verify published release body matches input
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          BODY_FILE: ${{ steps.body.outputs.body_file }}
        run: |
          set -euo pipefail
          expected="$(cat "$BODY_FILE" | sed -e 's/[[:space:]]*$//' )"
          actual="$(gh release view "$TAG_NAME" --json body --jq '.body' | sed -e 's/[[:space:]]*$//')"
          if [[ "$expected" == "$actual" ]]; then
            echo "Published release body matches input ($(printf %s "$expected" | wc -c) chars)."
            exit 0
          fi
          # Mismatch is rare but real -- GitHub occasionally normalises trailing
          # whitespace or rejects exotic characters. Auto-correct via gh release
          # edit, then re-verify.
          echo "::warning::Published body differs from input. Auto-correcting via gh release edit."
          gh release edit "$TAG_NAME" --notes-file "$BODY_FILE"
          recheck="$(gh release view "$TAG_NAME" --json body --jq '.body' | sed -e 's/[[:space:]]*$//')"
          if [[ "$recheck" != "$expected" ]]; then
            actual_path="$RUNNER_TEMP/release-body-actual.md"
            printf %s "$recheck" > "$actual_path"
            echo "::error::Release body still differs after auto-correct. Compare $BODY_FILE vs $actual_path in runner artifacts."
            exit 1
          fi
          echo "Auto-correct succeeded; body now matches input."

      - name: Smoke-check published artifact loads under yt-dlp
        # Pull the published wheel back from the release, install in a clean
        # venv alongside yt-dlp nightly, and verify the plugin namespace is
        # discovered. Catches a packaging regression that would silently let
        # production nodes update to a wheel that ships without extractors.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          smoke_dir="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke_dir"
          gh release download "$TAG_NAME" --pattern '*.whl' --dir "$smoke_dir"
          wheel="$(ls "$smoke_dir"/*.whl | head -1)"
          python3 -m venv "$smoke_dir/venv"
          # shellcheck disable=SC1091
          source "$smoke_dir/venv/bin/activate"
          pip install --upgrade pip
          pip install --pre 'yt-dlp[default]'
          pip install "$wheel"
          yt-dlp --version
          # `-v --simulate` against the placeholder URL verifies plugin
          # discovery: the verbose log prints "Extractor Plugins: ...".
          yt-dlp -v --simulate --skip-download --print '%(id)s|%(title)s' \
            'https://plugin-test.whyknot.dev/test/release-smoke' 2>&1 | tee "$smoke_dir/out"
          grep -qE 'Extractor Plugins:.*WhyKnotPluginPlaceholderIE' "$smoke_dir/out"

      - name: Commit promoted CHANGELOG.md + pyproject.toml back to main (verified)
        if: ${{ steps.beta.outputs.is_beta != 'true' }}
        # Same createCommitOnBranch pattern as changelog-append.yml so the
        # promotion commit lands signed and clears the protected-branch
        # signature rule (when one is added). Mirrors two files back to main:
        #   - CHANGELOG.md: the Unreleased->tag promotion done in this run.
        #   - pyproject.toml: the version bump done by build.ps1, so main's
        #     tarball (heads/main.tar.gz) actually carries the new version
        #     and downstream `pip install -U` sees an upgrade. Without this,
        #     production nodes installing from the tarball skip the upgrade
        #     and stay on the prior version.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Replay the stashed bytes so what we commit back exactly matches
          # what the release shipped.
          cp .changelog-stash/CHANGELOG.md CHANGELOG.md
          cp .pyproject-stash/pyproject.toml pyproject.toml
          # Compare each file against main's tip (we are on a tag, not a branch).
          main_oid=$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')
          main_changelog_blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$main_oid" --jq '.sha' 2>/dev/null || echo "")
          main_pyproject_blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/pyproject.toml?ref=$main_oid" --jq '.sha' 2>/dev/null || echo "")
          local_changelog_blob=$(git hash-object CHANGELOG.md)
          local_pyproject_blob=$(git hash-object pyproject.toml)

          additions=""
          if [[ "$main_changelog_blob" != "$local_changelog_blob" ]]; then
            additions="$additions CHANGELOG.md"
          fi
          if [[ "$main_pyproject_blob" != "$local_pyproject_blob" ]]; then
            additions="$additions pyproject.toml"
          fi
          if [[ -z "$additions" ]]; then
            echo "main already in promoted state -- nothing to commit."
            exit 0
          fi
          echo "Files to commit:$additions"

          changelog_b64=$(base64 -w 0 CHANGELOG.md)
          pyproject_b64=$(base64 -w 0 pyproject.toml)
          headline="docs(changelog): promote Unreleased -> ${TAG_NAME} [skip changelog]"
          body=$(printf '%s\n%s\n%s' \
            "Promotion commit by .github/workflows/release.yml after publishing ${TAG_NAME}." \
            'Mirrors the CHANGELOG.md that shipped in the release artifact back to main.' \
            'Also bumps pyproject.toml version so the heads/main.tar.gz install path picks up the new release.')

          # Compose fileChanges.additions dynamically based on which files
          # actually differ from main. Two cases (changelog only / both)
          # because pyproject.toml is the rarer case (only mutated by builds
          # that change the version, i.e. every tagged release).
          if [[ "$main_changelog_blob" != "$local_changelog_blob" && "$main_pyproject_blob" != "$local_pyproject_blob" ]]; then
            payload=$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "main" \
              --arg headline "$headline" \
              --arg body "$body" \
              --arg oid "$main_oid" \
              --arg changelog "$changelog_b64" \
              --arg pyproject "$pyproject_b64" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {
                  input: {
                    branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                    message: { headline: $headline, body: $body },
                    fileChanges: { additions: [
                      { path: "CHANGELOG.md", contents: $changelog },
                      { path: "pyproject.toml", contents: $pyproject }
                    ] },
                    expectedHeadOid: $oid
                  }
                }
              }')
          elif [[ "$main_changelog_blob" != "$local_changelog_blob" ]]; then
            payload=$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "main" \
              --arg headline "$headline" \
              --arg body "$body" \
              --arg oid "$main_oid" \
              --arg changelog "$changelog_b64" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {
                  input: {
                    branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                    message: { headline: $headline, body: $body },
                    fileChanges: { additions: [ { path: "CHANGELOG.md", contents: $changelog } ] },
                    expectedHeadOid: $oid
                  }
                }
              }')
          else
            payload=$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "main" \
              --arg headline "$headline" \
              --arg body "$body" \
              --arg oid "$main_oid" \
              --arg pyproject "$pyproject_b64" \
              '{
                query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
                variables: {
                  input: {
                    branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                    message: { headline: $headline, body: $body },
                    fileChanges: { additions: [ { path: "pyproject.toml", contents: $pyproject } ] },
                    expectedHeadOid: $oid
                  }
                }
              }')
          fi

          response=$(printf '%s' "$payload" | gh api graphql --input -)
          echo "$response" | jq .
          if echo "$response" | jq -e '.errors // empty' >/dev/null; then
            echo "::warning::createCommitOnBranch returned GraphQL errors; promotion not committed back to main. The release is still published; run the workflow manually or amend on next push."
            exit 0
          fi
          new_oid=$(echo "$response" | jq -r '.data.createCommitOnBranch.commit.oid')
          echo "Promotion commit: $new_oid"
