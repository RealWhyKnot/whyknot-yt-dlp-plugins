[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whyknot-yt-dlp-plugins"
version = "2026.5.12.0"
description = "Placeholder yt-dlp plugin package for WhyKnot.dev"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [{ name = "WhyKnot" }]
requires-python = ">=3.9"
# yt-dlp is intentionally NOT listed as a runtime dependency. The plugin is a
# yt-dlp drop-in -- it requires yt-dlp at import time but does not vendor it.
# Listing yt-dlp here causes pip/uv resolvers to "fix" the installed yt-dlp
# version on plugin install, which clobbers `--pre` (nightly) installs back
# down to the latest stable. The plugin loader walks installed packages for
# the `yt_dlp_plugins.extractor` namespace; co-residency in the same env is
# sufficient. Don't reintroduce this dependency without re-confirming the
# regression behaviour on a node that's pinned to nightly.
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]

# Test-only deps. Installed via `pip install -e ".[test]"`. yt-dlp is pulled
# in here so the test suite can import yt_dlp.extractor.common, but it stays
# OUT of `dependencies` so production installs don't clobber the nightly
# pinned yt-dlp on the nodes (see runtime-deps comment above).
[project.optional-dependencies]
test = [
    "pytest>=7",
    "yt-dlp",
]

[project.urls]
Homepage = "https://whyknot.dev"
Source = "https://github.com/RealWhyKnot/whyknot-yt-dlp-plugins"
Changelog = "https://github.com/RealWhyKnot/whyknot-yt-dlp-plugins/blob/main/CHANGELOG.md"

# yt-dlp's plugin loader walks `yt_dlp_plugins/extractor/` and `yt_dlp_plugins/postprocessor/`
# under any installed package. The `tool.hatch.build.targets.wheel` block below makes
# Hatchling include those directories in the built wheel even though they live at the
# repository root rather than inside a single package directory. Without this Hatchling
# guesses a single top-level package and the plugin namespace gets shipped empty.
[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]

[tool.hatch.build.targets.sdist]
include = ["/yt_dlp_plugins", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]
